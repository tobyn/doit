name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: toolchain/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Run tests ---

      - name: Test toolchain
        working-directory: toolchain
        run: go test ./...

      # --- Build platform binaries ---

      - name: Build binaries
        working-directory: toolchain
        run: |
          declare -A EXT
          EXT[windows]=zip
          EXT[darwin]=tar.gz
          EXT[linux]=tar.gz

          mkdir -p ../dist

          for os in windows darwin linux; do
            for arch in amd64 arm64; do
              name="doit-${os}-${arch}"
              bin="doit"
              if [ "$os" = "windows" ]; then bin="doit.exe"; fi

              GOOS=$os GOARCH=$arch go build -o "$bin" .

              if [ "${EXT[$os]}" = "zip" ]; then
                zip "../dist/${name}.zip" "$bin"
              else
                tar czf "../dist/${name}.tar.gz" "$bin"
              fi

              rm -f "$bin"
            done
          done

      # --- Build website ---

      - name: Build WASM
        working-directory: toolchain
        run: |
          GOOS=js GOARCH=wasm go build -o ../website/public/doit.wasm ./wasm/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../website/public/ 2>/dev/null \
            || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ../website/public/

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

      # --- Create GitHub release ---

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
